version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbt-chatbot-backend
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app/backend
      - ./logs:/var/log/chatbot
      - ./data:/app/data
    depends_on:
      - db
    networks:
      - cbt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Static Server
  frontend:
    image: nginx:latest
    container_name: cbt-chatbot-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./backend/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - cbt-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # SQLite Database (for development/light production)
  # Comment this out and use PostgreSQL for heavy production load
  db:
    image: alpine:latest
    container_name: cbt-chatbot-db
    volumes:
      - ./data:/data
    networks:
      - cbt-network
    command: tail -f /dev/null
    restart: unless-stopped

  # PostgreSQL Database (optional - for production)
  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: cbt-chatbot-postgres
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-chatbot}
  #     POSTGRES_USER: ${POSTGRES_USER:-chatbot}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - cbt-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  cbt-network:
    driver: bridge

volumes:
  postgres_data:
